<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - Store Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <div class="row bg-success text-white p-3 mb-4">
            <div class="col">
                <h1 class="h3 mb-0">
                    <i class="fas fa-box me-2"></i>
                    Product Management
                </h1>
                <p class="mb-0">Manage products in the inventory system</p>
            </div>
        </div>

        <!-- Form Section -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-light">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-plus-circle me-2"></i>
                            Product Information
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="productForm">
                            <!-- Hidden ID field for editing -->
                            <input type="hidden" id="id" name="id">
                            
                            <div class="row">
                                <!-- Name Field -->
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">
                                        <i class="fas fa-signature me-1"></i>
                                        Product Name <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="name" name="name" 
                                           placeholder="Enter product name" required maxlength="150">
                                </div>

                                <!-- Category Field (Foreign Key) -->
                                <div class="col-md-6 mb-3">
                                    <label for="category_id" class="form-label">
                                        <i class="fas fa-tags me-1"></i>
                                        Category <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-select" id="category_id" name="category_id" required>
                                        <option value="">Select a category</option>
                                        <!-- Options will be populated dynamically from database -->
                                    </select>
                                </div>
                            </div>

                            <!-- Description Field -->
                            <div class="mb-3">
                                <label for="description" class="form-label">
                                    <i class="fas fa-align-left me-1"></i>
                                    Description
                                </label>
                                <textarea class="form-control" id="description" name="description" 
                                          placeholder="Enter product description" rows="3"></textarea>
                            </div>

                            <div class="row">
                                <!-- Unit Value Field -->
                                <div class="col-md-4 mb-3">
                                    <label for="unit_value" class="form-label">
                                        <i class="fas fa-dollar-sign me-1"></i>
                                        Unit Price <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" class="form-control" id="unit_value" name="unit_value" 
                                               placeholder="0.00" step="0.01" min="0" required>
                                    </div>
                                </div>

                                <!-- Stock Field -->
                                <div class="col-md-4 mb-3">
                                    <label for="stock" class="form-label">
                                        <i class="fas fa-boxes me-1"></i>
                                        Stock Quantity <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" class="form-control" id="stock" name="stock" 
                                           placeholder="0" min="0" required>
                                </div>

                                <!-- Status Field -->
                                <div class="col-md-4 mb-3 d-flex align-items-end">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="status" name="status" checked>
                                        <label class="form-check-label" for="status">
                                            <i class="fas fa-toggle-on me-1"></i>
                                            Active Status
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                                <button type="button" class="btn btn-success" id="btnAdd">
                                    <i class="fas fa-plus me-1"></i>
                                    Add
                                </button>
                                <button type="button" class="btn btn-primary" id="btnEdit" disabled>
                                    <i class="fas fa-edit me-1"></i>
                                    Edit
                                </button>
                                <button type="button" class="btn btn-info" id="btnConsult">
                                    <i class="fas fa-search me-1"></i>
                                    Consult
                                </button>
                                <button type="button" class="btn btn-danger" id="btnDelete" disabled>
                                    <i class="fas fa-trash me-1"></i>
                                    Delete
                                </button>
                                <button type="button" class="btn btn-secondary" id="btnClear">
                                    <i class="fas fa-broom me-1"></i>
                                    Clear
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Quick Stats -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-light">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-chart-bar me-2"></i>
                            Quick Stats
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6 mb-3">
                                <div class="border rounded p-3">
                                    <h4 class="text-primary mb-0" id="totalProducts">0</h4>
                                    <small>Total Products</small>
                                </div>
                            </div>
                            <div class="col-6 mb-3">
                                <div class="border rounded p-3">
                                    <h4 class="text-success mb-0" id="activeProducts">0</h4>
                                    <small>Active</small>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="border rounded p-3">
                                    <h4 class="text-warning mb-0" id="lowStockProducts">0</h4>
                                    <small>Low Stock</small>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="border rounded p-3">
                                    <h4 class="text-info mb-0" id="totalValue">$0.00</h4>
                                    <small>Inventory Value</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- DataTable Section -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-list me-2"></i>
                            Products List
                        </h5>
                        <div>
                            <button type="button" class="btn btn-outline-warning btn-sm me-2" id="btnLowStock">
                                <i class="fas fa-exclamation-triangle me-1"></i>
                                Low Stock
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-sm" id="btnRefresh">
                                <i class="fas fa-sync-alt me-1"></i>
                                Refresh
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table id="productsTable" class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Category</th>
                                        <th>Description</th>
                                        <th>Unit Price</th>
                                        <th>Stock</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be populated by DataTables -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <!-- Custom JS -->
    <script src="../../js/inventory/product.js"></script>
</body>
</html>
