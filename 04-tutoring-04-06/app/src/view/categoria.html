<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1>Gestión de Categorías</h1>
    <h3>Registro de Categoría</h3>
    <form id="formCategoria" class="row g-3 mb-4">
      <div class="col-md-3">
        <label class="form-label">Código</label>
        <input type="text" class="form-control" id="categoriaCodigo" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" id="categoriaNombre" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Descripción</label>
        <input type="text" class="form-control" id="categoriaDescripcion" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">Estado</label>
        <select class="form-select" id="categoriaEstado" required>
          <option value="Activa">Activa</option>
          <option value="Inactiva">Inactiva</option>
        </select>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <button type="reset" class="btn btn-secondary">Cancelar</button>
      </div>
    </form>
    <h4>Lista de Categorías</h4>
    <table class="table table-striped" id="tablaCategorias">
      <thead>
        <tr>
          <th>Código</th><th>Nombre</th><th>Estado</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script type="module" src="../service/categoria.service.js"></script>
</body>
</html>
