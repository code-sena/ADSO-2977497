<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1>Gestión de Clientes</h1>
    <h3>Registro de Cliente</h3>
    <form id="formCliente" class="row g-3 mb-4">
      <div class="col-md-4">
        <label class="form-label">Tipo de Documento</label>
        <input type="text" class="form-control" id="clienteTipoDoc" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" id="clienteNombre" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Apellidos</label>
        <input type="text" class="form-control" id="clienteApellidos" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">Edad</label>
        <input type="number" class="form-control" id="clienteEdad" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="clienteCorreo" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control" id="clienteUsuario" readonly>
      </div>
      <div class="col-md-3">
        <label class="form-label">Contraseña</label>
        <input type="text" class="form-control" id="clienteContrasena" readonly>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <button type="reset" class="btn btn-secondary">Cancelar</button>
      </div>
    </form>
    <h4>Lista de Clientes</h4>
    <table class="table table-striped" id="tablaClientes">
      <thead>
        <tr>
          <th>Documento</th><th>Nombre</th><th>Apellidos</th><th>Correo</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script type="module" src="../service/cliente.service.js"></script>
</body>
</html>
