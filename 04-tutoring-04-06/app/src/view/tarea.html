<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1>Gestión de Tareas</h1>
    <h3>Registro de Tarea</h3>
    <form id="formTarea" class="row g-3 mb-4">
      <div class="col-md-2">
        <label class="form-label">Código</label>
        <input type="text" class="form-control" id="tareaCodigo" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" id="tareaNombre" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Descripción</label>
        <input type="text" class="form-control" id="tareaDescripcion" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Estado</label>
        <select class="form-select" id="tareaEstado" required>
          <option value="Agendada">Agendada</option>
          <option value="Cumplida">Cumplida</option>
          <option value="Cancelada">Cancelada</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Fecha Inicio</label>
        <input type="date" class="form-control" id="tareaFechaInicio" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Fecha Fin</label>
        <input type="date" class="form-control" id="tareaFechaFin" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Categoría</label>
        <select class="form-select" id="tareaCategoria" required></select>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <button type="reset" class="btn btn-secondary">Cancelar</button>
      </div>
    </form>
    <h4>Lista de Tareas</h4>
    <table class="table table-striped" id="tablaTareas">
      <thead>
        <tr>
          <th>Código</th><th>Nombre</th><th>Estado</th><th>Categoría</th><th>F. Inicio</th><th>F. Fin</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script type="module" src="../service/tarea.service.js"></script>
</body>
</html>
